name: AI Code Review Codium PR-agent OpenAi api (via Tailscale)

on:
  workflow_call: 
    inputs:
      pr_number:
        description: 'Input pull request number'
        required: true
        type: string
      api:
        description: 'Input api'
        required: true
        type: string  
      model_name:
        description: 'Select model'
        required: true
        default: 'qwen2.5-coder:14b'
        type: string  
      language:
        description: 'Select response language'
        required: true
        default: 'English'
        type: string  
  
jobs:  
          
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get git diff
        id: diff_step
        run: |
          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          
          BASE_BRANCH="${{ github.base_ref }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH=$DEFAULT_BRANCH
          fi
          
          echo "Base branch is determined as: $BASE_BRANCH"
          
          git fetch origin $BASE_BRANCH --depth=100
          
          git diff origin/$BASE_BRANCH HEAD -- . ':(exclude)*.lock' > diff.txt
          
          if [ -s diff.txt ]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
            echo "Changes found."
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi
          
      - name: Prepare API
        id: get_api_step
        uses: innasolp/GithubActions/.github/actions/prepare_llm_api@main 
        with:
          provider: ${{ inputs.api }}
          model_name: ${{ inputs.model_name }}
          all_secrets: ${{ toJSON(secrets) }}

      - name: Connect to Tailscale
        if: inputs.api == 'LLAMA'
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci    
          
      - name: Install PR-Agent natively
        run: |
          pip install 'pr-agent[github]'

      - name: PR Agent - Description & Changes
        run: |
          export HTTP_PROXY=""
          export HTTPS_PROXY=""
          export http_proxy=""
          export https_proxy=""
          export NO_PROXY="localhost,127.0.0.1,100.*"
          export no_proxy="localhost,127.0.0.1,100.*"
          
          if [ "${{ inputs.api }}" = "Llama" ] || [ "${{ inputs.api }}" = "LLAMA" ]; then
            SAFE_NAME=$(echo "${{ inputs.model_name }}" | sed 's/:/-/g')
            FINAL_MODEL_NAME="openai/$SAFE_NAME"
          else
            FINAL_MODEL_NAME="openai/${{ inputs.model_name }}"
          fi

          echo "Отправка запроса для модели: $FINAL_MODEL_NAME"

          # Создаем файл настроек, который PR-Agent безуспешно пытается найти в логах
          SETTINGS_DIR="/home/runner/.local/lib/python3.12/site-packages/pr_agent/settings"
          mkdir -p "$SETTINGS_DIR"
          
          cat <<EOF > "$SETTINGS_DIR/.secrets.toml"
          [config]
          model="$FINAL_MODEL_NAME"
          fallback_models=[]
          ai_timeout=1200
          custom_model_max_context_tokens=32000
          custom_model_max_tokens=4000
          
          [pr_questions]
          model="$FINAL_MODEL_NAME"
          fallback_models=[]
          
          [pr_reviewer]
          model="$FINAL_MODEL_NAME"
          
          [pr_description]
          model="$FINAL_MODEL_NAME"

          [openai]
          key="${{ steps.get_api_step.outputs.api_token }}"
          api_base="${{ steps.get_api_step.outputs.api_url }}"
          timeout=1200
          
          [github]
          user_token="${{ secrets.GITHUB_TOKEN }}"
          EOF

          # Теперь запускаем pr-agent максимально чисто, без флагов конфигурации
          pr-agent \
            --pr_url="${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}" \
            ask "In ${{ inputs.language }}, provide a short summary of the main changes in this PR and describe what it does."

       
      - name: PR Agent - Bug Analysis
        run: |
          export GITHUB__USER_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export OPENAI__API_BASE="${{ steps.get_api_step.outputs.api_url }}"
          export OPENAI__KEY="${{ steps.get_api_step.outputs.api_token }}"
          export OPENAI_API_BASE="${{ steps.get_api_step.outputs.api_url }}"
          export OPENAI_API_KEY="${{ steps.get_api_step.outputs.api_token }}"export HTTP_PROXY=""
          export HTTPS_PROXY=""
          export http_proxy=""
          export https_proxy=""
          export NO_PROXY="localhost,127.0.0.1,100.*"
          export no_proxy="localhost,127.0.0.1,100.*"
          
          # Точно так же убираем двоеточие для локальной Llama
          if [ "${{ inputs.api }}" = "LLAMA" ]; then
            SAFE_NAME=$(echo "${{ inputs.model_name }}" | sed 's/:/-/g')
            FINAL_MODEL_NAME="openai/$SAFE_NAME"
          else
            FINAL_MODEL_NAME="openai/${{ inputs.model_name }}"
          fi

          echo "Отправка запроса анализа багов для модели: $FINAL_MODEL_NAME"

          export PR_AGENT_CONFIG__MODEL="$FINAL_MODEL_NAME"
          export PR_AGENT_PR_QUESTIONS__MODEL="$FINAL_MODEL_NAME"
          export PR_AGENT_PR_REVIEWER__MODEL="$FINAL_MODEL_NAME"
          export PR_AGENT_PR_DESCRIPTION__MODEL="$FINAL_MODEL_NAME"
          export PR_AGENT_CONFIG__FALLBACK_MODELS="[]"
          export PR_AGENT_CONFIG__AI_TIMEOUT="1200"

          pr-agent \
            --config "config.custom_model_max_context_tokens=32000" \
            --config "config.custom_model_max_tokens=4000" \
            --pr_url="${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}" \
            ask "Point out any critical bugs, logical errors, or performance issues in the code changes. Answer ONLY in ${{ inputs.language }} language."
