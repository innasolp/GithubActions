name: AI Code Review Codium PR-agent OpenAi api (via Tailscale)

on:
  workflow_call: 
    inputs:
      pr_number:
        description: 'Input pull request number'
        required: true
        type: string
      api:
        description: 'Input api'
        required: true
        type: string  
      model_name:
        description: 'Select model'
        required: true
        default: 'qwen2.5-coder:14b'
        type: string  
      language:
        description: 'Select response language'
        required: true
        default: 'English'
        type: string  
  
jobs:  
          
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get git diff
        id: diff_step
        run: |
          DEFAULT_BRANCH=$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')
          
          BASE_BRANCH="${{ github.base_ref }}"
          if [ -z "$BASE_BRANCH" ]; then
            BASE_BRANCH=$DEFAULT_BRANCH
          fi
          
          echo "Base branch is determined as: $BASE_BRANCH"
          
          git fetch origin $BASE_BRANCH --depth=100
          
          git diff origin/$BASE_BRANCH HEAD -- . ':(exclude)*.lock' > diff.txt
          
          if [ -s diff.txt ]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
            echo "Changes found."
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi
          
      - name: Prepare API
        id: get_api_step
        run: |
          if [ "${{ inputs.api }}" = "OpenRouter" ]; then 
            val="${{ secrets.OPENROUTER_ENDPOINT }}"
            # Для OpenRouter оставляем стандартный префикс openai/
            echo "TARGET_MODEL=openai/${{ inputs.model_name }}" >> $GITHUB_ENV
          elif [ "${{ inputs.api }}" = "Llama" ]; then
            # Для локальной Llama дописываем /v1, необходимый для OpenAI-клиента pr-agent
            val="${{ secrets.LLAMA_ENDPOINT }}/v1"
            # Для Llama используем префикс custom/, чтобы отключить логику GPT-5 и заставить LiteLLM ждать
            echo "TARGET_MODEL=custom/${{ inputs.model_name }}" >> $GITHUB_ENV
            
            gh workflow run llama-check-model.yaml \
              --repo innasolp/GithubActions \
              --ref main \
              -f model_name="${{ inputs.model_name }}"
          fi
          
          echo "API_URL=$val" >> $GITHUB_ENV
          echo "Selected API: $val"
        env:
          GH_TOKEN: ${{ secrets.REPO_ACTION_TOKEN }}

      - name: Connect to Tailscale
        if: inputs.api == 'Llama'
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci    
          
      - name: Install PR-Agent natively
        run: |
          pip install pr-agent

      - name: PR Agent - Description & Changes
        run: |
          export GITHUB__USER_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export OPENAI__API_BASE="$API_URL"
          export OPENAI__API_KEY="dummy-key-for-local"
          
          export HTTP_PROXY=""
          export HTTPS_PROXY=""
          export http_proxy=""
          export https_proxy=""
          export NO_PROXY="localhost,127.0.0.1,100.*"
          export no_proxy="localhost,127.0.0.1,100.*"
          
          # Настройки передаются динамически через $TARGET_MODEL
          # Добавлен параметр openai.timeout=1200 для сквозного контроля сессии LiteLLM
          pr-agent \
            --config "config.model=$TARGET_MODEL" \
            --config "config.ai_timeout=1200" \
            --config "openai.timeout=1200" \
            --config "config.custom_model_max_context_tokens=32000" \
            --config "config.custom_model_max_tokens=4000" \
            --config "config.fallback_models=[]" \
            --config "openai.fallback_models=[]" \
            --config "litellm.fallback_models=[]" \
            --pr_url="${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}" \
            ask "In ${{ inputs.language }}, provide a short summary of the main changes in this PR and describe what it does."
       
      - name: PR Agent - Bug Analysis
        run: |
          export GITHUB__USER_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export OPENAI__API_BASE="$API_URL"
          export OPENAI__API_KEY="dummy-key-for-local"
          
          export HTTP_PROXY=""
          export HTTPS_PROXY=""
          export http_proxy=""
          export https_proxy=""
          export NO_PROXY="localhost,127.0.0.1,100.*"
          export no_proxy="localhost,127.0.0.1,100.*"
          
          pr-agent \
            --config "config.model=$TARGET_MODEL" \
            --config "config.ai_timeout=1200" \
            --config "openai.timeout=1200" \
            --config "config.custom_model_max_context_tokens=32000" \
            --config "config.custom_model_max_tokens=4000" \
            --config "config.fallback_models=[]" \
            --config "openai.fallback_models=[]" \
            --config "litellm.fallback_models=[]" \
            --pr_url="${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}" \
            ask "Point out any critical bugs, logical errors, or performance issues in the code changes. Answer ONLY in ${{ inputs.language }} language."
