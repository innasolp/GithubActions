name: Push Action to All Repos

on:
  workflow_dispatch:
    inputs:
      push_to_default:
        description: 'Push to default branch (main/master)'
        type: boolean
        default: true
      push_to_develop:
        description: 'Push to develop (if exists)'
        type: boolean
        default: false
      action_yaml:
        description: 'action file'
        type: string
        required: true

jobs:
  distribute-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central repository
        uses: actions/checkout@v4

      - name: Process all repositories
        env:
          GH_TOKEN: ${{ secrets.REPO_ACTION_TOKEN }} 
          PUSH_DEFAULT: ${{ github.event.inputs.push_to_default }}
          PUSH_DEVELOP: ${{ github.event.inputs.push_to_develop }}
        run: |
          if [ "$PUSH_DEFAULT" != "true" ] && [ "$PUSH_DEVELOP" != "true" ]; then
            echo "❌ Error: No branch for push."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${{ secrets.REPO_ACTION_TOKEN }}@github.com/".insteadOf "https://github.com"
          
          repos=("Alchemist" "WebLoaders" "Messages" "Import" "LogExtensions" "DependencyInjection" "HttpExtensions" "Configuration" "GrpcExtension" "Json.CustomSerialization")
          FILE_PATH="${{ github.event.inputs.action_yaml }}"

          for repo in "${repos[@]}"; do
            echo "--------------------------------------------------"
            echo "🛠️ Repository: $repo"

            gh repo clone "$repo" "temp-$repo" || { echo "❌ Cloning $repo failed"; continue; }
            cd "temp-$repo"

            TARGET_DIR=$(dirname "$FILE_PATH")
            default_branch=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
            echo "📍 Default branch: $default_branch"

            # ==========================================
            # 1. ОБНОВЛЕНИЕ DEFAULT BRANCH
            # ==========================================
            if [ "$PUSH_DEFAULT" == "true" ]; then
              echo "➡️ Processing $default_branch..."
              
              attr_rule="*.{yaml,yml} linguist-generated=true"
              if ! grep -qsF "$attr_rule" .gitattributes 2>/dev/null; then
                echo "$attr_rule" >> .gitattributes
              fi

              mkdir -p "$TARGET_DIR"
              cp "../$FILE_PATH" "./$FILE_PATH"

              git add --force .gitattributes "$FILE_PATH"
              
              if [ -n "$(git status --porcelain)" ]; then
                git commit -m "chore: distribute global action to $default_branch"
                git push origin "$default_branch"
                echo "🚀 Pushing to $default_branch completed successfully."
              else
                echo "ℹ️ No changes for $default_branch, files are actual."
              fi
            fi

            # ==========================================
            # 2. ОБНОВЛЕНИЕ DEVELOP BRANCH
            # ==========================================
            if [ "$PUSH_DEVELOP" == "true" ]; then
              # Надежный способ проверить, есть ли ветка на сервере (без grep)
              has_develop=$(git ls-remote --heads origin develop)

              if [ -n "$has_develop" ]; then
                echo "➡️ Processing develop..."
                
                # Скачиваем develop и переключаемся на нее (сбрасывая локальные изменения, если они были)
                git fetch origin develop
                git checkout -B develop origin/develop
                
                # Применяем изменения файла заново, уже находясь в ветке develop
                if ! grep -qsF "$attr_rule" .gitattributes 2>/dev/null; then
                  echo "$attr_rule" >> .gitattributes
                fi

                mkdir -p "$TARGET_DIR"
                cp "../$FILE_PATH" "./$FILE_PATH"

                git add .gitattributes "$FILE_PATH"
                
                if [ -n "$(git status --porcelain)" ]; then
                  git commit -m "chore: distribute global action to develop"
                  git push origin develop
                  echo "🚀 Pushing to develop completed successfully"
                else
                  echo "ℹ️ No changes for develop, files are actual."
                fi
              else
                echo "ℹ️ Branch develop not found on origin. Skipped."
              fi
            fi

            cd ..
            rm -rf "temp-$repo"
          done

          echo "🎉 All repositories handled successfully."
